name: Bug report
description: Something isn't working
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Notcheur
        2. Go to ...
        3. ...
    validations:
      required: false
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. 26.1"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Notcheur version
      description: Menu bar icon ▸ Settings
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options:
        - Notes
        - Clipboard
        - Timers
        - Zen
        - Now Playing
        - Calendar
        - The launcher itself / notch
        - Purchases
        - Not sure
    validations:
      required: false
